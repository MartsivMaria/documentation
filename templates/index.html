<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <title>WordPress Dashboard</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #D39595;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: #ffffff;
            border-bottom: 2px solid #D39595;
            padding-bottom: 10px;
            font-size: 42px;
            margin-bottom: 25px;
        }

        .post {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
            border-left: 6px solid #D39595;
        }

        .btn {
            display: inline-block;
            background: #D39595;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #B27F7F;
        }

        .post-meta {
            margin-top: 10px;
            font-size: 0.85em;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        .actions {
            margin-top: 15px;
        }

        .actions hr {
            border: 0;
            border-top: 1px solid #333;
            margin-bottom: 10px;
        }

        .actions a {
            margin-right: 15px;
            font-size: 0.9em;
            text-decoration: none;
            color: #90caf9;
            transition: 0.2s;
        }

        .actions a:hover {
            text-decoration: underline;
        }

        .delete {
            color: #ff6b6b !important;
        }

        strong {
            color: #D39595;
        }
    </style>
</head>

<body>

    <div class="logo">WordPress</div>

    <div class="container">
        <h1>Новини</h1>

        <a href="{{ url_for('create') }}" class="btn">+ Додати новий допис</a>

        {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>

            <div class="post-meta">
                <span>Автор: <strong>{{ post.author }}</strong></span>
                <span>Опубліковано: {{ post.date_posted.strftime('%d.%m.%Y') }}</span>
            </div>

            <div class="actions">
                <hr>
                <a href="{{ url_for('edit', id=post.id) }}">Редагувати</a>
                <a href="{{ url_for('delete', id=post.id) }}" class="delete"
                    onclick="return confirm('Видалити?')">Видалити</a>
            </div>
        </div>
        {% endfor %}
    </div>

</body>

</html>
